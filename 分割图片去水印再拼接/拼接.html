<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Combine 9 Images into One Canvas</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            padding: 20px;
        }
        canvas {
            border: 1px solid #ccc;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<h1>3×3 拼图示例</h1>
<canvas id="combinedCanvas"></canvas>

<script>
    (function() {
        const canvas = document.getElementById('combinedCanvas');
        const ctx = canvas.getContext('2d');
        const imgCount = 9;
        const cols = 3;
        const rows = 3;

        // 构造图片路径数组：images/1.png ... images/9.png
        const srcs = Array.from({ length: imgCount }, (_, i) => `images/${i+1}.png`);

        // 加载所有图片，返回 Promise<Image> 数组
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        Promise.all(srcs.map(loadImage))
            .then(images => {
                // 假设所有图片同宽同高，以第一张为准
                const w = images[0].width;
                const h = images[0].height;

                // 设置 canvas 大小
                canvas.width  = w * cols;
                canvas.height = h * rows;

                // 按顺序绘制：0→(0,0), 1→(w,0), 2→(2w,0), 3→(0,h), ...
                images.forEach((img, idx) => {
                    const col = idx % cols;
                    const row = Math.floor(idx / cols);
                    ctx.drawImage(img, col * w, row * h, w, h);
                });
            })
            .catch(err => {
                console.error('图片加载失败：', err);
            });
    })();
</script>
</body>
</html>
