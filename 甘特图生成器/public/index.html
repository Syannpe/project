<script src="./package/HTMLToImage.js"></script>

<script type="module">
    import {HTMLInterface} from "./interfaces/HTMLInterface.js";
    import "./utils/main.js";

    document.addEventListener("DOMContentLoaded", function () {
        async function captureJPEG(node, quality = 0.95) {
            // 第一次截图，可能会残缺（尤其是 iOS/Safari）
            let dataUrl = await htmlToImage.toJpeg(node, {quality});
            // 创建图片对象加载第一次截图图像
            await new Promise(resolve => {
                const img = new Image();
                img.src = dataUrl;
                img.onload = resolve;
            });
            // 再次截图，确保最终输出完整图像
            return htmlToImage.toJpeg(node, {quality});
        }

        async function capturePNG(node) {
            // 第一次截图，可能会残缺（尤其是 iOS/Safari）
            let dataUrl = await htmlToImage.toPng(node);
            // 创建图片对象加载第一次截图图像
            await new Promise(resolve => {
                const img = new Image();
                img.src = dataUrl;
                img.onload = resolve;
            });
            // 再次截图，确保最终输出完整图像
            return htmlToImage.toPng(node);
        }

        // const htmlInterface = new HTMLInterface();
        // htmlInterface.init(new Date("2020-9-30"), new Date("2020-10-7"));
        // htmlInterface.drawRow("1", "任务1", new Date("2020-10-1"), new Date("2020-10-2"), new Date("2020-10-5"), new Date("2020-10-6"), "orange", "50%")
        // htmlInterface.drawDate(0, new Date("2020-10-1"), new Date("2020-10-2"), new Date("2020-10-5"), new Date("2020-10-6"))
        // htmlInterface.drawRow("1", "任务1", new Date("2020-10-1"), new Date("2020-10-2"), new Date("2020-10-5"), new Date("2020-10-6"), "orange", "50%")
        // htmlInterface.drawDate(1, new Date("2020-10-2"), new Date("2020-10-2"), new Date("2020-10-5"), new Date("2020-10-4"))
        window.addEventListener('keydown', async ev => {
            if (!ev.ctrlKey || ev.key !== 'p') return false;
            ev.preventDefault();

            try {
                const node = document.querySelector("table#chart-table");
                const dataUrl = await capturePNG(node); // 截图并确保完整
                const link = document.createElement('a');
                link.download = 'capture.jpg';
                link.href = dataUrl;
                link.click();
            } catch (err) {
                console.error('截图并下载失败', err);
            }
        });
    });

</script>
